[project]
name = "oraculoto"
version = "0.1.0"
description = "Lottery results, statistics and honest guesses (Mega-Sena first)"
requires-python = ">=3.13"
dependencies = [
    "a2wsgi>=1.10.10",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pyjwt[crypto]>=2.15.1",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.6",
]

[project.optional-dependencies]
# the home-machine fetcher (docs/crawler.md §7); the server never talks to Caixa
fetch = ["httpx2>=2.16.0"]

[project.scripts]
oraculoto = "oraculoto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oraculoto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with calls in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# generated by Alembic autogenerate
"src/oraculoto/db/migrations/versions/*" = ["E501"]
# long SQL strings copied from docs/database.md §6
"tests/test_import.py" = ["E501"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "uvicorn>=0.54.0",
]
