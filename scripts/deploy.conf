# Deployment target, read by the scripts/deploy-*.sh scripts. No secrets here: SSH uses your keys.
# Any value can be overridden for one run from the environment, e.g. DEPLOY_HOST=other scripts/deploy-web.sh

# SSH login on DreamHost.
DEPLOY_HOST="${DEPLOY_HOST:-platypusweb@paulovelho.com}"

# The project's checkout on the server (~/oraculoto), relative to the SSH user's home.
# Relative on purpose: rsync's argument protection can leave a leading "~" unexpanded.
DEPLOY_PATH="${DEPLOY_PATH:-oraculoto}"

# scripts/fetch.sh: the games to crawl, space-separated slugs (each needs a row in `games` and a Caixa field map).
FETCH_GAMES="${FETCH_GAMES:-megasena}"
